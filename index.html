<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年齢入力フォーム</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .box { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 80%; max-width: 400px; }
        input, button { padding: 10px; font-size: 16px; margin: 10px 0; width: 80%; }
        button { background-color: #06C755; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>年齢を教えてください</h2>
        <p>AIがあなたに合わせた話し方へ調整します！</p>
        
        <div>
            <input type="number" id="ageInput" placeholder="例: 20" min="1" max="120"> 歳
        </div>
        <button onclick="submitAge()">送信する</button>
        <p id="result" style="color: green;"></p>
    </div>

    <script>
        let currentUserId = "";

        // ページが読み込まれたときにLIFFを初期化
        window.onload = async function() {
            try {
                // ご自身のLIFF IDに書き換えてください（または自動取得）
                await liff.init({ liffId: "2011069818-MqlqxNyM" });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    currentUserId = profile.userId; // LINEのユーザーIDを自動取得
                }
            } catch (error) {
                console.log("LIFF Initialization failed: " + error);
            }
        };

        async function submitAge() {
            const age = document.getElementById('ageInput').value;

            if (!age) {
                alert('年齢を入力してください。');
                return;
            }

            if (!currentUserId) {
                alert('ユーザーIDが取得できていません。LINEアプリ内から開き直してください。');
                return;
            }

            const response = await fetch('/api/register_age', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, age: parseInt(age) })
            });

            const result = await response.json();
            if (response.ok) {
                document.getElementById('result').innerText = '登録完了しました！トーク画面に戻ってください。';
                setTimeout(() => { liff.closeWindow(); }, 2000); // 2秒後に自動で画面を閉じる
            } else {
                alert('エラーが発生しました: ' + result.message);
            }
        }
    </script>
</body>
</html>
